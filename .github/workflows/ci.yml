name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ai/requirements.txt
            ingestion/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify migrations apply from empty and are idempotent
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head
          python -m alembic current
      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci_test.db
        run: python -m pytest -q

  ai:
    name: AI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt -r ai/requirements.txt
      - working-directory: ai
        run: python -m pytest tests -q

  ingestion:
    name: Ingestion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r backend/requirements.txt -r ingestion/requirements.txt
      - working-directory: ingestion
        run: python -m pytest tests -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx tsc --noEmit
      # Build exactly what ships: no NEXT_PUBLIC_API_URL, so the bundle uses the
      # same same-origin relative base as the deployed site.
      - working-directory: frontend
        run: npm run build
      # The deployed site is served from this committed export (Render has no
      # Node). If a build ever fails to write it, or `out/` returns to
      # .gitignore, production would silently serve no UI.
      - name: Verify the committed export is present
        run: test -f frontend/out/index.html