[project]
name = "amucs-nexus-backend"
version = "0.1.0"
description = "AMUCS Nexus backend: FastAPI REST API and application logic."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]