[project]
name = "amucs-nexus-backend"
version = "0.1.0"
description = "AMUCS Nexus backend: FastAPI REST API and application logic."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27",
  "python-multipart>=0.0.12,<1.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "pywebpush>=2.0,<3.0",
  "py-vapid>=1.7,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]